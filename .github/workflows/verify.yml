name: verify

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: verify / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # CI matrix только ubuntu: Firebase Hosting target тоже ubuntu, поэтому
    # production-like подпись адекватна. Windows локально проверяется автором
    # на дев-машине (полный verify gate без env-флагов). На shared GitHub
    # Actions windows runner полный verify систематически > 45 мин (×1.4-1.6
    # к ubuntu) и cancelled по timeout даёт overall=cancelled, который
    # `continue-on-error` не ловит (только failure). Проверено 2026-05-22.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Security audit (fail on high+ vulnerabilities)
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps
      - name: Run verify gate
        # `SIM_CI_HEADLESS_OPTIONAL=1` помечает обе headless-browser фазы
        # (`scenario export` и `playwright`) как warning-only: на shared CI
        # runner без аппаратного GPU Chromium headless + SwiftShader идёт
        # ×3-5 медленнее i7+RTX, физика не успевает в per-test timeout 60s.
        #
        # Доказательность ВКР сохраняется: главные артефакты (JSON-протоколы
        # в `docs/experiments/`) проверяются CPU-only шагом `scenario logs`
        # (фаза 2, строгий). Логика покрыта vitest (212 unit тестов, строгий).
        # Build, budgets, bundle, hosting render — тоже строгие.
        #
        # Локально verify запускается без этого env и держит обе headless фазы
        # обязательными.
        env:
          SIM_CI_HEADLESS_OPTIONAL: '1'
        run: npm run verify
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload dist on success (ubuntu only)
        if: success() && matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
