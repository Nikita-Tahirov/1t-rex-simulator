name: verify

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: verify / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Security audit (fail on high+ vulnerabilities)
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps
      - name: Run verify gate
        # `SIM_CI_SCENARIO_OPTIONAL=1` помечает фазу `scenario export`
        # (полный прогон 8 сценариев в Chromium-headless) как warning-only:
        # на shared CI runner без аппаратного GPU Rapier WASM не успевает в
        # per-scenario timeout. Главная доказательность ВКР — JSON-протоколы
        # в `docs/experiments/` — проверяется CPU-only шагом `scenario logs`
        # (фаза 2), который остаётся строгим. Локально verify запускается
        # без этого env и держит scenario:export обязательным.
        env:
          SIM_CI_SCENARIO_OPTIONAL: '1'
        run: npm run verify
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload dist on success (ubuntu only)
        if: success() && matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
